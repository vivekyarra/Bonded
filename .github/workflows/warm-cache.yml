name: Warm Qloo cache & run evaluation

# Run manually after adding the QLOO_API_KEY (and optionally ANTHROPIC_API_KEY) repository
# secrets. Commits data/qloo-cache.json, data/eval-results.json and docs/evaluation.md so
# the deployed demo is instant and the evaluation page has real numbers.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QLOO_API_KEY: ${{ secrets.QLOO_API_KEY }}
      QLOO_BASE_URL: https://hackathon.api.qloo.com
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: claude-opus-5-5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Qloo smoke test
        run: npm run qloo:smoke
      - name: Warm cache
        run: npm run warm-cache
      - name: Gold-set evaluation
        run: npm run eval
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/qloo-cache.json data/eval-results.json docs/evaluation.md
          git diff --cached --quiet || git commit -m "Warm Qloo cache and record gold-set evaluation"
          git push
